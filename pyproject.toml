[project]
name = "egypocket-tts"
version = "0.1.0"
description = "Fast CPU Egyptian-Arabic TTS built on Kyutai's Pocket TTS, with diacritic pronunciation override"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pocket-tts @ git+https://github.com/kyutai-labs/pocket-tts@797209501de994aaa4e84a4e29f2fd98d2f5283a",
    "numpy>=2",
    "scipy>=1.10",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "tokenizers>=0.21",
    "pyyaml>=6",
]

[project.optional-dependencies]
train = [
    "transformers>=4.57,<6",
    "huggingface_hub>=0.30",
    "tqdm>=4.60",
    "tensorboard>=2.16",
    "pytorch_lightning>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["egypocket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
